[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temprior"
version = "0.1.0rc4"
description = "A transferable learned temporal prior for outbreak transmission reconstruction with decision-relevant uncertainty."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Ahsan Karim" }]
keywords = ["epidemiology", "outbreak", "transmission", "phylodynamics", "contact-tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.1",
]

[project.urls]
Preprint = "https://arxiv.org/abs/2606.30842"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
temprior = "temprior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temprior = ["default_prior.json"]
