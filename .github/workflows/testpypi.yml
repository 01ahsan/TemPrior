name: publish-testpypi

# Dry-run publishing to TestPyPI. Trigger it either from the Actions tab
# ("Run workflow") or by pushing a release-candidate tag like v0.1.0rc1.
# Build and publish are separate jobs so the OIDC identity only ever touches
# already-built artifacts (the recommended secure pattern).

on:
  workflow_dispatch:            # manual button in the Actions tab
  push:
    tags:
      - "v*rc*"                 # e.g. v0.1.0rc1
      - "v*a*"                  # e.g. v0.1.0a1
      - "v*b*"                  # e.g. v0.1.0b1

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/temprior
    permissions:
      id-token: write           # mandatory for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
