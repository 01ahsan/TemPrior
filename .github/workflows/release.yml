name: publish-pypi

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable version
        run: |
          python - <<'PY'
          import ast, os, pathlib, re, tomllib
          meta = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          version = meta['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert meta['name'] == 'temprior'
          assert meta['authors'] == [{'name': 'Md Ahsan Karim'}]
          tree = ast.parse(pathlib.Path('src/temprior/__init__.py').read_text())
          runtime = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert runtime == version
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/temprior/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  draft-release:
    name: Draft GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "TemPrior $RELEASE_TAG" --generate-notes
          fi
